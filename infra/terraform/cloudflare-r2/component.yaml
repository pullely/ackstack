apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-r2
  description: Provisions the Cloudflare R2 bucket holding policy documents (stage and prod)
  labels:
    domain: infra
    scope: policy-document-store

spec:
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: cloudflare-r2
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # SEC-JOB: the wiring document (bucket name) is lease-published post-apply;
    # policies-worker deploys read it back as WIRING_CLOUDFLARE_R2_<ENV>.
    secretOutputs: "WIRING_CLOUDFLARE_R2=wiring"

  # A brokered token of its own, minted under the `r2-data` scope template
  # ("Workers R2 Storage Write"): the deploy token (workers-deploy) cannot touch
  # storage, and this one cannot deploy code — the same split the baseline makes
  # for D1 with CLOUDFLARE_D1_TOKEN. Minted per environment with
  # `--param buckets=ackstack-policy-docs-<env>` (the template requires the param).
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_ZHB3EG27/ackstack/{{ .environment }}/CLOUDFLARE_R2_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_ZHB3EG27/ackstack/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_ZHB3EG27/ackstack/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
