apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: policies-worker
  description: Cloudflare Worker for the policy acknowledgments runtime
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/policies-worker
  dependsOn:
    # db-migrate first, so 200_policies_core is applied before code that reads it.
    - component: db-migrate
    - component: membership-worker
    - component: policy-worker
    - component: notifications-worker
    - component: cloudflare-r2
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_ZHB3EG27/ackstack/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_ZHB3EG27/ackstack/prod/WIRING_CLOUDFLARE_D1"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the wiring manifests (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: ackstack

    turboFilter: "@saas/policies-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    # The R2 bucket binds by NAME, which cloudflare-r2 derives deterministically
    # (stg-ackstack-policy-docs-stage / prod-ackstack-policy-docs-prod — the
    # runner injects namespacePrefix), so only D1 needs a wiring document.
    wiringComponents: "cloudflare-d1"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/policies-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/policies-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: policies
    runtime: cloudflare
